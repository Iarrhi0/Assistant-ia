name: Build APK V13.4 Clean

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          Z=$(find . -maxdepth 2 -type f -name "file-ai-assistant-android10-v13-4-build-clean.zip" | head -1)
          test -n "$Z"
          echo "zip=$Z" >> "$GITHUB_OUTPUT"
          echo "Using: $Z"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -o "${{ steps.project.outputs.zip }}" -d extracted
          P=$(find extracted -type f -name pubspec.yaml | head -1)
          test -n "$P"
          echo "PROJECT_ROOT=$(dirname "$P")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup Flutter sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          cp lib/main.dart /tmp/fileai-main.dart
          cp pubspec.yaml /tmp/fileai-pubspec.yaml
          test -s /tmp/fileai-main.dart
          test -s /tmp/fileai-pubspec.yaml
          echo "Sources backed up"

      - name: Generate Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          rm -rf android test
          flutter create \
            --platforms=android \
            --project-name file_ai_assistant \
            --org com.fileai \
            .
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android scaffold generated"

      - name: Restore Flutter sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          cp /tmp/fileai-main.dart lib/main.dart
          cp /tmp/fileai-pubspec.yaml pubspec.yaml
          rm -rf test
          test -s lib/main.dart
          test -s pubspec.yaml
          echo "Sources restored"

      - name: Configure Android 10 storage
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          # Remove ALL old READ/WRITE declarations, then add one canonical copy.
          text = re.sub(
              r'\s*<uses-permission\b[^>]*android:name="android\.permission\.(?:READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)"[^>]*/>\s*',
              '\n',
              text,
              flags=re.MULTILINE,
          )

          permissions = (
              '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
          )

          pos = text.find(">")
          if pos < 0:
              raise RuntimeError("Invalid AndroidManifest.xml")

          text = text[:pos + 1] + permissions + text[pos + 1:]

          if 'android:requestLegacyExternalStorage="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1,
              )

          text = text.replace(
              'android:label="file_ai_assistant"',
              'android:label="File AI Assistant"',
          )

          text = re.sub(r'\n{3,}', '\n\n', text)
          manifest.write_text(text, encoding="utf-8")

          # Keep min SDK compatible with dependencies and Android 10.
          for gradle in [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]:
              if not gradle.exists():
                  continue
              g = gradle.read_text(encoding="utf-8")
              g = g.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 23",
              )
              g = g.replace(
                  "minSdkVersion flutter.minSdkVersion",
                  "minSdkVersion 23",
              )
              gradle.write_text(g, encoding="utf-8")

          print("Android 10 configuration written successfully.")
          PY
          echo "Configure step completed with shell exit code 0"

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          read_count = len(re.findall(
              r'android:name="android\.permission\.READ_EXTERNAL_STORAGE"',
              text,
          ))
          write_count = len(re.findall(
              r'android:name="android\.permission\.WRITE_EXTERNAL_STORAGE"',
              text,
          ))

          checks = {
              "READ_EXTERNAL_STORAGE exactly once": read_count == 1,
              "WRITE_EXTERNAL_STORAGE exactly once": write_count == 1,
              "WRITE works through API 29":
                  'WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"' in text,
              "requestLegacyExternalStorage enabled":
                  'android:requestLegacyExternalStorage="true"' in text,
          }

          for name, ok in checks.items():
              print(("OK   " if ok else "FAIL ") + name)

          if not all(checks.values()):
              print("\n===== AndroidManifest.xml =====")
              print(text)
              sys.exit(1)

          print("Manifest verification passed.")
          PY

      - name: Get dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Format Dart
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          dart format lib/main.dart

      - name: Analyze Dart
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Verify and copy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" File-AI-Assistant-V13.4-Android10.apk
          ls -lh File-AI-Assistant-V13.4-Android10.apk

      - uses: actions/upload-artifact@v4
        with:
          name: File-AI-Assistant-V13.4-Android10
          path: File-AI-Assistant-V13.4-Android10.apk
          if-no-files-found: error
          retention-days: 30
