name: Build APK Final

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate exact V6 ZIP
        id: project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "file-ai-assistant-android10-v6-final.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: file-ai-assistant-android10-v6-final.zip introuvable."
            echo "Supprime les anciens ZIP ou ajoute exactement le ZIP V6."
            exit 1
          fi

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP utilisé: $ZIP_FILE"

      - name: Extract only V6 project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "${{ steps.project.outputs.zip }}" -d extracted

          PUBSPEC=$(find extracted -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml introuvable."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          cp lib/main.dart /tmp/file_ai_main.dart
          cp pubspec.yaml /tmp/file_ai_pubspec.yaml

          rm -rf android test

          flutter create \
            --platforms=android \
            --project-name file_ai_assistant \
            --org com.fileai \
            .

          cp /tmp/file_ai_main.dart lib/main.dart
          cp /tmp/file_ai_pubspec.yaml pubspec.yaml

          # The generated test contains MyApp(), which is not our app.
          # Tests are not needed to compile the APK.
          rm -rf test

          python tool/patch_android10.py

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Format application source
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          dart format lib/main.dart

      - name: Remove generated tests again
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          rm -rf test
          echo "Generated tests removed."
          find . -maxdepth 2 -type f -name "widget_test.dart" -print -delete || true

      - name: Build release APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk n'existe pas."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/File-AI-Assistant-Android10.apk"
          echo "APK créé avec succès:"
          ls -lh "$GITHUB_WORKSPACE/File-AI-Assistant-Android10.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: File-AI-Assistant-Android10
          path: File-AI-Assistant-Android10.apk
          if-no-files-found: error
          retention-days: 30
