name: Unzip and Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Aucun fichier ZIP trouvé dans le dépôt."
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP trouvé: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "${{ steps.findzip.outputs.zip }}" -d extracted

          PUBSPEC=$(find extracted -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml introuvable dans le ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Projet détecté: $PROJECT_ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Regenerate complete Android project
        shell: bash
        run: |
          cd "$PROJECT_ROOT"

          # Preserve our actual application source before flutter create.
          cp lib/main.dart /tmp/file_ai_main.dart
          cp pubspec.yaml /tmp/file_ai_pubspec.yaml

          rm -rf android

          flutter create \
            --platforms=android \
            --project-name file_ai_assistant \
            --org com.fileai \
            .

          # Restore the app source and dependencies.
          cp /tmp/file_ai_main.dart lib/main.dart
          cp /tmp/file_ai_pubspec.yaml pubspec.yaml

          python tool/patch_android10.py

      - name: Get dependencies
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Dart format check
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          dart format lib/main.dart

      - name: Analyze without blocking on warnings
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK non créé."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/File-AI-Assistant-Android10.apk"
          ls -lh "$GITHUB_WORKSPACE/File-AI-Assistant-Android10.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: File-AI-Assistant-Android10-APK
          path: File-AI-Assistant-Android10.apk
          if-no-files-found: error
          retention-days: 30
