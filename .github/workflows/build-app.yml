name: Unzip And Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun ZIP trouvé."
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.findzip.outputs.zip }}" -d extracted
          PUBSPEC=$(find extracted -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml introuvable."
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Analyze
        run: |
          cd "$PROJECT_ROOT"
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/File-AI-Assistant.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: File-AI-Assistant-APK
          path: File-AI-Assistant.apk
          if-no-files-found: error
          retention-days: 30
