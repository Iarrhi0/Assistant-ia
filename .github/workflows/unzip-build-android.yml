name: Unzip and Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect newest ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "Aucun fichier ZIP trouvé à la racine du dépôt."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"
          rm -rf "$RUNNER_TEMP/phone-organizer-src"
          mkdir -p "$RUNNER_TEMP/phone-organizer-src"

          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/phone-organizer-src"

          echo "Contenu extrait :"
          find "$RUNNER_TEMP/phone-organizer-src" -maxdepth 3 -type f | sort | head -200

      - name: Detect Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(find "$RUNNER_TEMP/phone-organizer-src" \
            -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "${ROOT:-}" ]; then
            echo "Projet Android Gradle introuvable."
            echo "Il faut trouver settings.gradle.kts ou settings.gradle dans le ZIP."
            exit 1
          fi

          if [ ! -d "$ROOT/app" ]; then
            echo "Dossier app/ introuvable dans : $ROOT"
            exit 1
          fi

          echo "Projet Android détecté : $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle clean assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "${{ steps.project.outputs.root }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "APK non trouvé après compilation."
            exit 1
          fi

          echo "APK : $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneOrganizer-debug-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
