name: Build APK V13.5 Picker Verified Snapshot

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          Z=$(find . -maxdepth 2 -type f -name "file-ai-assistant-android10-v13-5-picker-verified-snapshot.zip" | head -1)
          test -n "$Z"
          echo "zip=$Z" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -o "${{ steps.project.outputs.zip }}" -d extracted
          P=$(find extracted -type f -name pubspec.yaml | head -1)
          test -n "$P"
          echo "PROJECT_ROOT=$(dirname "$P")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backup Flutter sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          cp lib/main.dart /tmp/fileai-main.dart
          cp pubspec.yaml /tmp/fileai-pubspec.yaml

      - name: Generate Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          rm -rf android test
          flutter create \
            --platforms=android \
            --project-name file_ai_assistant \
            --org com.fileai \
            .

      - name: Restore Flutter sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          cp /tmp/fileai-main.dart lib/main.dart
          cp /tmp/fileai-pubspec.yaml pubspec.yaml
          rm -rf test

      - name: Configure Android 10 storage
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          text = re.sub(
              r'\s*<uses-permission\b[^>]*android:name="android\.permission\.(?:READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)"[^>]*/>\s*',
              '\n',
              text,
              flags=re.MULTILINE,
          )

          permissions = (
              '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
          )

          pos = text.find(">")
          if pos < 0:
              raise RuntimeError("Invalid AndroidManifest.xml")

          text = text[:pos + 1] + permissions + text[pos + 1:]

          if 'android:requestLegacyExternalStorage="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1,
              )

          text = text.replace(
              'android:label="file_ai_assistant"',
              'android:label="File AI Assistant"',
          )

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          text = Path(
              "android/app/src/main/AndroidManifest.xml"
          ).read_text()

          checks = [
              len(re.findall(
                  r'android:name="android\.permission\.READ_EXTERNAL_STORAGE"',
                  text,
              )) == 1,
              len(re.findall(
                  r'android:name="android\.permission\.WRITE_EXTERNAL_STORAGE"',
                  text,
              )) == 1,
              'WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"' in text,
              'android:requestLegacyExternalStorage="true"' in text,
          ]

          if not all(checks):
              print(text)
              sys.exit(1)

          print("Android manifest OK")
          PY

      - name: Get dependencies
        run: cd "$PROJECT_ROOT" && flutter pub get

      - name: Format Dart
        run: cd "$PROJECT_ROOT" && dart format lib/main.dart

      - name: Analyze Dart
        run: cd "$PROJECT_ROOT" && flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: cd "$PROJECT_ROOT" && flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" File-AI-Assistant-V13.5-Android10.apk

      - uses: actions/upload-artifact@v4
        with:
          name: File-AI-Assistant-V13.5-Android10
          path: File-AI-Assistant-V13.5-Android10.apk
          if-no-files-found: error
