name: Universal Flutter ZIP → APK v4 Hardened

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect newest ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=$(
            find . -type f -name "*.zip" \
              ! -path "./.git/*" \
              ! -path "./build/*" \
              ! -path "./dist/*" \
              ! -path "./artifacts/*" \
              -printf '%T@ %p\n' |
            sort -nr |
            head -1 |
            cut -d' ' -f2-
          )

          if [ -z "${ZIP_PATH:-}" ]; then
            echo "❌ Aucun ZIP trouvé dans le dépôt."
            exit 1
          fi

          echo "path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ ZIP détecté : $ZIP_PATH"

      - name: Validate and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "${{ steps.zip.outputs.path }}" >/dev/null

          rm -rf extracted
          mkdir extracted
          unzip -q -o "${{ steps.zip.outputs.path }}" -d extracted

          echo "✅ ZIP valide et extrait."

      - name: Detect Flutter app
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r PUB; do
            DIR=$(dirname "$PUB")
            if [ -f "$DIR/lib/main.dart" ]; then
              PROJECT_ROOT="$DIR"
              break
            fi
          done < <(find extracted -type f -name pubspec.yaml | sort)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "❌ Aucun projet Flutter avec lib/main.dart."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "✅ Projet : $PROJECT_ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Environment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20 || true

      # Action officielle : installe cmdline-tools + sdkmanager et l'ajoute
      # elle-même au PATH. Plus fiable que de deviner où flutter-action a
      # placé le SDK.
      - name: Setup Android SDK cmdline-tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          command -v sdkmanager >/dev/null || {
            echo "❌ sdkmanager toujours introuvable après setup-android."
            exit 1
          }

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          for TRY in 1 2 3; do
            if sdkmanager \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "platform-tools"; then
              echo "✅ Android SDK 36 disponible."
              exit 0
            fi

            [ "$TRY" -lt 3 ] && sleep $((TRY * 10))
          done

          echo "❌ Impossible d'installer Android SDK 36."
          exit 1

      - name: Preflight pubspec
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          test -s pubspec.yaml
          test -s lib/main.dart

          python3 - <<'PY'
          from pathlib import Path
          import sys

          text = Path("pubspec.yaml").read_text(encoding="utf-8")

          required = ["name:", "environment:", "dependencies:", "flutter:"]
          missing = [x for x in required if x not in text]

          if missing:
              print("❌ pubspec.yaml incomplet :", missing)
              sys.exit(1)

          print("✅ pubspec.yaml structure OK")
          PY

      - name: Resolve Dart dependencies first
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          for TRY in 1 2 3; do
            echo "flutter pub get : tentative $TRY/3"

            if flutter pub get; then
              echo "✅ Dépendances Dart résolues."
              exit 0
            fi

            [ "$TRY" -lt 3 ] && sleep $((TRY * 10))
          done

          echo "❌ Conflit réel dans pubspec.yaml ou indisponibilité pub.dev."
          exit 1

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "ℹ️ Android absent : création."

            cp lib/main.dart /tmp/fileai-main.dart
            cp pubspec.yaml /tmp/fileai-pubspec.yaml
            [ -f pubspec.lock ] && cp pubspec.lock /tmp/fileai-pubspec.lock || true

            flutter create \
              --platforms=android \
              --project-name file_ai_assistant \
              --org com.fileai \
              .

            cp /tmp/fileai-main.dart lib/main.dart
            cp /tmp/fileai-pubspec.yaml pubspec.yaml
            [ -f /tmp/fileai-pubspec.lock ] && cp /tmp/fileai-pubspec.lock pubspec.lock || true
          else
            echo "✅ Android existant conservé."
          fi

          # Supprime seulement le test Flutter template incorrect.
          if [ -f test/widget_test.dart ]; then
            if grep -q "MyApp(" test/widget_test.dart && \
               ! grep -qE 'class[[:space:]]+MyApp\b' lib/main.dart; then
              echo "🧹 widget_test.dart template supprimé."
              rm -f test/widget_test.dart
            fi
          fi

      - name: Harden Gradle repositories
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path

          # Modern Flutter projects normally already contain these.
          # We only add missing repositories without replacing valid config.
          for path in [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
          ]:
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              if "pluginManagement" in text:
                  if "google()" not in text:
                      text = text.replace(
                          "repositories {",
                          "repositories {\n        google()",
                          1,
                      )
                  if "mavenCentral()" not in text:
                      text = text.replace(
                          "repositories {",
                          "repositories {\n        mavenCentral()",
                          1,
                      )
                  if "gradlePluginPortal()" not in text:
                      text = text.replace(
                          "repositories {",
                          "repositories {\n        gradlePluginPortal()",
                          1,
                      )

              path.write_text(text, encoding="utf-8")

          gp = Path("android/gradle.properties")
          current = gp.read_text(encoding="utf-8") if gp.exists() else ""

          desired = {
              "org.gradle.jvmargs": "-Xmx4096M -Dfile.encoding=UTF-8",
              "android.useAndroidX": "true",
              "android.enableJetifier": "true",
              "org.gradle.daemon": "false",
              "org.gradle.parallel": "true",
              "org.gradle.caching": "true",
          }

          lines = [
              line for line in current.splitlines()
              if not any(line.startswith(k + "=") for k in desired)
          ]
          lines += [f"{k}={v}" for k, v in desired.items()]
          gp.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("✅ Gradle repositories/properties hardened.")
          PY

      - name: Configure Android compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          gradles = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          found = False

          for path in gradles:
              if not path.exists():
                  continue

              found = True
              text = path.read_text(encoding="utf-8")

              if path.suffix == ".kts":
                  # compileSdk: new plugins such as file_picker require 36.
                  if re.search(r'compileSdk\s*=', text):
                      text = re.sub(
                          r'compileSdk\s*=\s*[^\n]+',
                          'compileSdk = 36',
                          text,
                      )

                  # Keep Android 10 compatibility.
                  if re.search(r'minSdk\s*=', text):
                      text = re.sub(
                          r'minSdk\s*=\s*[^\n]+',
                          'minSdk = 23',
                          text,
                      )

                  if re.search(r'targetSdk\s*=', text):
                      text = re.sub(
                          r'targetSdk\s*=\s*[^\n]+',
                          'targetSdk = 35',
                          text,
                      )

              else:
                  if re.search(r'compileSdkVersion\s+', text):
                      text = re.sub(
                          r'compileSdkVersion\s+[^\n]+',
                          'compileSdkVersion 36',
                          text,
                      )
                  elif re.search(r'compileSdk\s+', text):
                      text = re.sub(
                          r'compileSdk\s+[^\n]+',
                          'compileSdk 36',
                          text,
                      )

                  if re.search(r'minSdkVersion\s+', text):
                      text = re.sub(
                          r'minSdkVersion\s+[^\n]+',
                          'minSdkVersion 23',
                          text,
                      )

                  if re.search(r'targetSdkVersion\s+', text):
                      text = re.sub(
                          r'targetSdkVersion\s+[^\n]+',
                          'targetSdkVersion 35',
                          text,
                      )

              path.write_text(text, encoding="utf-8")
              print(f"✅ Android SDK config : {path}")

          if not found:
              print("❌ build.gradle(.kts) Android absent")
              sys.exit(1)
          PY

      - name: Normalize Android manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          # Déduplique toutes les permissions par android:name.
          rx = re.compile(
              r'\s*<uses-permission\b[^>]*android:name="([^"]+)"[^>]*/>\s*',
              re.MULTILINE,
          )

          seen = set()
          output = []
          last = 0

          for m in rx.finditer(text):
              output.append(text[last:m.start()])
              name = m.group(1)

              if name not in seen:
                  seen.add(name)
                  output.append("\n    " + m.group(0).strip())

              last = m.end()

          output.append(text[last:])
          text = "".join(output)

          # Android 10 shared-storage compatibility when these permissions
          # are needed by the application.
          if "android.permission.READ_EXTERNAL_STORAGE" in text or \
             "android.permission.WRITE_EXTERNAL_STORAGE" in text:
              if 'android:requestLegacyExternalStorage="true"' not in text:
                  text = text.replace(
                      "<application",
                      '<application\n        android:requestLegacyExternalStorage="true"',
                      1,
                  )

          path.write_text(text, encoding="utf-8")
          print("✅ AndroidManifest.xml normalisé.")
          PY

      - name: Full pre-build verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          errors = []

          if not Path("lib/main.dart").exists():
              errors.append("lib/main.dart absent")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              errors.append("AndroidManifest.xml absent")
          else:
              m = manifest.read_text(encoding="utf-8")
              perms = re.findall(
                  r'<uses-permission\b[^>]*android:name="([^"]+)"',
                  m,
              )
              dup = sorted({x for x in perms if perms.count(x) > 1})
              if dup:
                  errors.append(f"permissions dupliquées: {dup}")

          gradle = (
              Path("android/app/build.gradle.kts")
              if Path("android/app/build.gradle.kts").exists()
              else Path("android/app/build.gradle")
          )

          if not gradle.exists():
              errors.append("build.gradle Android absent")
          else:
              g = gradle.read_text(encoding="utf-8")
              if not re.search(
                  r'compileSdk(?:Version)?\s*(?:=|\s)\s*36\b',
                  g,
              ):
                  errors.append("compileSdk 36 non confirmé")

          if errors:
              print("❌ PRE-BUILD FAILED")
              for e in errors:
                  print(" -", e)
              sys.exit(1)

          print("✅ PRE-BUILD COMPLET OK")
          PY

      - name: Analyze only application code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          flutter analyze lib \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build APK with intelligent retry
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          rm -f /tmp/fileai-build.log

          for TRY in 1 2 3; do
            echo "===== BUILD $TRY/3 ====="

            set +e
            flutter build apk --release 2>&1 | tee /tmp/fileai-build.log
            RC=${PIPESTATUS[0]}
            set -e

            if [ "$RC" -eq 0 ]; then
              echo "✅ BUILD RÉUSSI"
              exit 0
            fi

            # Do not waste three long attempts on deterministic code/config errors.
            if grep -Eqi \
              "compileSdk.*at least|uses-sdk:minSdkVersion|Dart.*error|Undefined name|isn't defined|version solving failed|Manifest merger failed|duplicate" \
              /tmp/fileai-build.log; then
              echo "❌ Erreur déterministe détectée : retry inutile."
              exit "$RC"
            fi

            # Retry only likely external Gradle/Maven/network failures.
            if grep -Eqi \
              "Could not GET|Could not resolve|Connection reset|timed out|status code 403|status code 429|Temporary failure|network" \
              /tmp/fileai-build.log; then
              if [ "$TRY" -lt 3 ]; then
                WAIT=$((TRY * 20))
                echo "⚠️ Erreur réseau externe. Retry dans ${WAIT}s."
                sleep "$WAIT"
                continue
              fi
            fi

            echo "❌ Erreur non-réseau : arrêt pour ne pas perdre de minutes."
            exit "$RC"
          done

          exit 1

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          APK=$(find build/app/outputs/flutter-apk \
            -type f \
            -name "*release*.apk" \
            | head -1)

          if [ -z "${APK:-}" ]; then
            echo "❌ APK release absent."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/File-AI-Assistant.apk"
          ls -lh "$GITHUB_WORKSPACE/File-AI-Assistant.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: File-AI-Assistant-APK
          path: File-AI-Assistant.apk
          if-no-files-found: error
          retention-days: 30
